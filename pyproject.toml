[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xldiff"
version = "0.1.1"
description = "Fingerprint .xlsx workbooks, estimate how similar two are, and pick the versions of a lineage worth keeping."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando González" }]
keywords = ["xlsx", "excel", "diff", "similarity", "minhash", "deduplication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Fergonz1993/xldiff"
Repository = "https://github.com/Fergonz1993/xldiff"
Releases = "https://github.com/Fergonz1993/xldiff/releases"

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
xldiff = "xldiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xldiff"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
